<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Relógio de cabeceira</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Relógio">
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; color: #ffb000; -webkit-transition: opacity .5s, color .4s; transition: opacity .5s, color .4s; }
#time { font-weight: 200; font-size: 30vw; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
#sec { font-size: 4vw; font-weight: 300; opacity: .6; margin-left: .15em; }
#date { font-weight: 300; font-size: 4.4vw; margin-top: 3vw; opacity: .75; }
#controls { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; opacity: .35; }
.dot { display: inline-block; width: 34px; height: 34px; border-radius: 50%; margin: 0 9px; border: 2px solid transparent; vertical-align: middle; }
.dot.on { border-color: #fff; }
#fmt { display: inline-block; margin-left: 18px; padding: 8px 14px; border: 1px solid #888; border-radius: 8px; color: #ccc; font-size: 16px; vertical-align: middle; }
#wx { cursor: pointer; }
#wx3 { font-size: 2.4vw; font-weight: 300; margin-top: .6vw; opacity: .7; }
@media (orientation: landscape) { #wx3 { font-size: 1.9vw; } }
#city { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; background: #000; color: #ddd; padding: 30px 5vw; overflow: auto; -webkit-overflow-scrolling: touch; }
#city h2 { font-size: 22px; font-weight: 300; margin: 0 0 16px; }
#cityIn { width: 55%; font-size: 20px; padding: 10px; background: #111; color: #fff; border: 1px solid #666; border-radius: 8px; -webkit-appearance: none; }
.btn { display: inline-block; padding: 11px 16px; margin-left: 8px; border: 1px solid #888; border-radius: 8px; font-size: 18px; color: #ddd; }
.cityItem { padding: 16px 6px; border-bottom: 1px solid #333; font-size: 20px; }
#cityRes { margin-top: 16px; font-size: 18px; }
#wx { margin-top: 3vw; padding: 1.4vw 3vw; border: 1px solid currentColor; border-radius: 14px; text-align: center; opacity: .85; min-width: 40vw; }
#wx1 { font-size: 5.5vw; font-weight: 300; line-height: 1.2; }
#wx2 { font-size: 2.8vw; font-weight: 300; margin-top: .6vw; opacity: .8; }
@media (orientation: landscape) { #time { font-size: 24vw; } #sec { font-size: 3vw; } #date { font-size: 3.4vw; margin-top: 1.5vw; } #wx { margin-top: 1.5vw; padding: 1vw 2.5vw; min-width: 32vw; } #wx1 { font-size: 4vw; } #wx2 { font-size: 2.2vw; } }
</style>
</head>
<body>
<div id="stage">
  <div id="time"><span id="hm">--:--</span><span id="sec"></span></div>
  <div id="date"></div>
  <div id="wx"><div id="wx1">--</div><div id="wx2">Carregando previsão...</div></div>
</div>
<div id="city"><h2>Escolher cidade da previsão</h2><div><input id="cityIn" type="text" placeholder="Digite o nome da cidade" autocapitalize="words" autocorrect="off"><span class="btn" id="cityGo">Buscar</span><span class="btn" id="cityClose">Fechar</span></div><div id="cityRes"></div></div>
<div id="controls">
  <span class="dot" data-c="#ffb000" style="background:#ffb000"></span><span class="dot" data-c="#c81e1e" style="background:#c81e1e"></span><span class="dot" data-c="#3ddc84" style="background:#3ddc84"></span><span class="dot" data-c="#5aa9ff" style="background:#5aa9ff"></span><span class="dot" data-c="#e8e0d0" style="background:#e8e0d0"></span><span id="fmt">24h</span>
</div>
<script>
(function () {
  var dias = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  var meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var levels = [1, 0.5, 0.25, 0.1];
  var state = { color: "#ffb000", level: 0, h24: true };
  var stage = document.getElementById("stage");
  var hm = document.getElementById("hm");
  var sec = document.getElementById("sec");
  var dateEl = document.getElementById("date");
  var fmt = document.getElementById("fmt");
  var dots = document.querySelectorAll(".dot");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem("relogio") || "null");
      if (s) { state.color = s.color || state.color; state.level = s.level || 0; state.h24 = s.h24 !== false; }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem("relogio", JSON.stringify(state)); } catch (e) {}
  }

  function apply() {
    stage.style.color = state.color;
    stage.style.opacity = levels[state.level];
    fmt.innerHTML = state.h24 ? "24h" : "12h";
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = "dot" + (dots[i].getAttribute("data-c") === state.color ? " on" : "");
    }
  }

  function tick() {
    var d = new Date();
    var h = d.getHours();
    var suffix = "";
    if (!state.h24) { suffix = h >= 12 ? " pm" : " am"; h = h % 12; if (h === 0) { h = 12; } }
    hm.innerHTML = (state.h24 ? pad(h) : h) + ":" + pad(d.getMinutes());
    sec.innerHTML = pad(d.getSeconds()) + suffix;
    dateEl.innerHTML = dias[d.getDay()] + ", " + d.getDate() + " de " + meses[d.getMonth()];
  }

  stage.onclick = function () { state.level = (state.level + 1) % levels.length; apply(); save(); };
  fmt.onclick = function () { state.h24 = !state.h24; apply(); tick(); save(); };
  for (var i = 0; i < dots.length; i++) {
    dots[i].onclick = function () { state.color = this.getAttribute("data-c"); apply(); save(); };
  }

  // Local da previsão: troque LAT e LON pelas coordenadas da sua cidade
  var place = { name: "São Bernardo do Campo", lat: -23.69, lon: -46.56 };
  try {
    var savedPlace = JSON.parse(localStorage.getItem("relogioCidade") || "null");
    if (savedPlace && savedPlace.lat && savedPlace.lon) { place = savedPlace; }
  } catch (e) {}
  var LAT = place.lat, LON = place.lon;
  var wx3 = document.createElement("div");
  wx3.id = "wx3";
  document.getElementById("wx").appendChild(wx3);
  function setCity() { wx3.textContent = "\uD83D\uDCCD " + place.name; }
  setCity();

  var cityEl = document.getElementById("city");
  var cityIn = document.getElementById("cityIn");
  var cityRes = document.getElementById("cityRes");

  function cityClose() { cityEl.style.display = "none"; cityIn.blur(); }
  function cityChoose(r) {
    place = { name: r.name, lat: r.latitude, lon: r.longitude };
    try { localStorage.setItem("relogioCidade", JSON.stringify(place)); } catch (e) {}
    LAT = place.lat; LON = place.lon;
    setCity(); wxOk = false;
    wx1.innerHTML = "--"; wx2.innerHTML = "Carregando previsão...";
    cityClose(); wxLoad();
  }
  function cityItem(r) {
    var el = document.createElement("div");
    el.className = "cityItem";
    var label = r.name;
    if (r.admin1) { label += ", " + r.admin1; }
    if (r.country) { label += " (" + r.country + ")"; }
    el.textContent = label;
    el.onclick = function () { cityChoose(r); };
    return el;
  }
  function citySearch() {
    var q = cityIn.value.replace(/^\s+|\s+$/g, "");
    if (!q) { return; }
    cityRes.textContent = "Buscando...";
    try {
      var x = new XMLHttpRequest();
      x.open("GET", "https://geocoding-api.open-meteo.com/v1/search?count=6&language=pt&format=json&name=" + encodeURIComponent(q), true);
      x.timeout = 15000;
      x.onreadystatechange = function () {
        if (x.readyState !== 4) { return; }
        if (x.status !== 200) { cityRes.textContent = "Não foi possível buscar agora."; return; }
        try {
          var d = JSON.parse(x.responseText);
          cityRes.innerHTML = "";
          if (!d.results || !d.results.length) { cityRes.textContent = "Nenhuma cidade encontrada."; return; }
          for (var i = 0; i < d.results.length; i++) { cityRes.appendChild(cityItem(d.results[i])); }
        } catch (e) { cityRes.textContent = "Não foi possível buscar agora."; }
      };
      x.send();
    } catch (e) { cityRes.textContent = "Não foi possível buscar agora."; }
  }
  document.getElementById("wx").onclick = function (ev) {
    ev = ev || window.event;
    if (ev.stopPropagation) { ev.stopPropagation(); }
    cityIn.value = ""; cityRes.innerHTML = "";
    cityEl.style.display = "block";
  };
  document.getElementById("cityClose").onclick = cityClose;
  document.getElementById("cityGo").onclick = citySearch;
  cityIn.onkeyup = function (ev) { if ((ev || window.event).keyCode === 13) { citySearch(); } };
  var wx1 = document.getElementById("wx1");
  var wx2 = document.getElementById("wx2");
  var wxOk = false;

  function wxInfo(c) {
    if (c === 0) { return ["\u2600\uFE0F", "Céu limpo"]; }
    if (c === 1 || c === 2) { return ["\u26C5", "Parcialmente nublado"]; }
    if (c === 3) { return ["\u2601\uFE0F", "Nublado"]; }
    if (c === 45 || c === 48) { return ["\uD83C\uDF2B", "Neblina"]; }
    if (c >= 51 && c <= 57) { return ["\uD83C\uDF26", "Garoa"]; }
    if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) { return ["\uD83C\uDF27", "Chuva"]; }
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) { return ["\u2744\uFE0F", "Neve"]; }
    if (c >= 95) { return ["\u26C8", "Tempestade"]; }
    return ["\u2601\uFE0F", "Tempo variável"];
  }

  function wxShow(d) {
    var info = wxInfo(d.daily.weathercode[0]);
    wx1.innerHTML = info[0] + " " + Math.round(d.current_weather.temperature) + "°";
    wx2.innerHTML = info[1] + " · mín " + Math.round(d.daily.temperature_2m_min[0]) + "° · máx " + Math.round(d.daily.temperature_2m_max[0]) + "° · chuva " + Math.round(d.daily.precipitation_probability_max[0]) + "%";
    wxOk = true;
  }

  function wxFail() {
    if (!wxOk) { wx1.innerHTML = "--"; wx2.innerHTML = "Previsão indisponível"; }
  }

  function wxLoad() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1";
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.timeout = 15000;
      x.onreadystatechange = function () {
        if (x.readyState !== 4) { return; }
        if (x.status === 200) {
          try { wxShow(JSON.parse(x.responseText)); } catch (e) { wxFail(); }
        } else { wxFail(); }
      };
      x.send();
    } catch (e) { wxFail(); }
  }

  load(); apply(); tick();
  wxLoad();
  setInterval(wxLoad, 30 * 60 * 1000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
